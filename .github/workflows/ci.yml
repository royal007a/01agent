name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build CLI
        run: go build -o /tmp/01agent ./cmd/01agent
      - name: Build HTTP service
        run: go build -o /tmp/01agentd ./cmd/01agentd
      - name: Build Feishu bridge
        run: go build -o /tmp/01agent-feishu ./cmd/01agent-feishu
      - name: Build evaluator and replay tool
        run: |
          go build -o /tmp/01agent-eval ./cmd/01agent-eval
          go build -o /tmp/01agent-replay ./cmd/01agent-replay
          GOOS=linux go build -o /tmp/01agent-sandbox ./cmd/01agent-sandbox
      - name: Run deterministic evaluation gate
        run: go run ./cmd/01agent-eval --suite evals/runtime.json --artifacts /tmp/01agent-eval-artifacts --report /tmp/01agent-eval-artifacts/report.json
